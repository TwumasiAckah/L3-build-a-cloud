# API Deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-api
  labels:
    app: postgres-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: postgres-api
  template:
    metadata:
      labels:
        app: postgres-api
    spec:
      serviceAccountName: postgres-api
      imagePullSecrets:
        - name: stackit-registry-secret
      containers:
        - name: api
          image: registry.onstackit.cloud/l3-cloud-psql/postgres-api:909a83588bbd403468932196b8c7d6251ce377ec
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GIN_MODE
              value: "release"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-api
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "create", "delete", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-api
subjects:
  - kind: ServiceAccount
    name: postgres-api

---
# UI deployment

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-ui
  namespace: postgres-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: postgres-ui
  template:
    metadata:
      labels:
        app: postgres-ui
    spec:
      containers:
        - name: ui
          image: registry.onstackit.cloud/l3-cloud-psql/postgres-ui:<commit-sha>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-ui
  namespace: postgres-api
spec:
  selector:
    app: postgres-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

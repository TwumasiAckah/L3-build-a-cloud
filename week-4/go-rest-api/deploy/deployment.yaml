# API DEPLOYMENT
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-api
  labels:
    app: postgres-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: postgres-api
  template:
    metadata:
      labels:
        app: postgres-api
    spec:
      serviceAccountName: postgres-api
      imagePullSecrets:
        - name: stackit-registry-secret
      containers:
        - name: api
          image: registry.onstackit.cloud/l3-cloud-psql/postgres-api:ec0967eb641a586ebcf617aaf928d26a6abeddc6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: NAMESPACE
              value: "postgres-clusters"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: JWT_SECRET
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: ADMIN_PASSWORD
            - name: GIN_MODE
              value: "release"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: postgres-api-global
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "create", "delete", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: postgres-api-global-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: postgres-api-global
subjects:
  - kind: ServiceAccount
    name: postgres-api
    namespace: postgres-api

---
# UI DEPLOYMENT
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: postgres-ui
  template:
    metadata:
      labels:
        app: postgres-ui
    spec:
      imagePullSecrets:
        - name: stackit-registry-secret
      containers:
        - name: ui
          image: registry.onstackit.cloud/l3-cloud-psql/postgres-ui:ec0967eb641a586ebcf617aaf928d26a6abeddc6
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
# UI SERVICE
apiVersion: v1
kind: Service
metadata:
  name: postgres-ui
spec:
  selector:
    app: postgres-ui
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    chart: loki-stack
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 2.10.2
    helm:
      values: |
        loki:
          persistence:
            enabled: true
            size: 20Gi
        promtail:
          enabled: true
          config:
            snippets:
              pipelineStages:
                - json:
                    expressions:
                      log_type: log_type
                      user: user
                      action: action
                - labels:
                    log_type:
                    user:
                    action:
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

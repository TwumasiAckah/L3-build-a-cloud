name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      REGISTRY: registry.onstackit.cloud
      API_IMAGE: registry.onstackit.cloud/l3-cloud-psql/postgres-api
      UI_IMAGE: registry.onstackit.cloud/l3-cloud-psql/postgres-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: week-4/go-rest-api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest

      - name: Build and push UI
        uses: docker/build-push-action@v5
        with:
          context: week-5/react-cloud-ui
          push: true
          tags: |
            ${{ env.UI_IMAGE }}:${{ github.sha }}
            ${{ env.UI_IMAGE }}:latest

      - name: Update image tags in deployment
        run: |
          sed -i "s|image: ${{ env.API_IMAGE }}.*|image: ${{ env.API_IMAGE }}:${{ github.sha }}|g" week-4/go-rest-api/deploy/deployment.yaml
          sed -i "s|image: ${{ env.UI_IMAGE }}.*|image: ${{ env.UI_IMAGE }}:${{ github.sha }}|g" week-4/go-rest-api/deploy/deployment.yaml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add week-4/go-rest-api/deploy/deployment.yaml
          git commit -m "deploy: update api and ui images to ${{ github.sha }}"
          git push origin main

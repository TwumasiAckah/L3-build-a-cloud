name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

env:
  REGISTRY: registry.onstackit.cloud
  API_IMAGE: registry.onstackit.cloud/l3-cloud-psql/postgres-api
  UI_IMAGE: registry.onstackit.cloud/l3-cloud-psql/postgres-ui

jobs:
  # TESTING
  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: week-4/go-rest-api/go.sum
      - name: Run Tests
        working-directory: week-4/go-rest-api
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          go mod download
          go test -v -race ./...

  playwright-tests:
    name: Playwright E2E
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: week-5/e2e-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"
          cache-dependency-path: week-5/e2e-tests/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: week-4/go-rest-api/go.sum

      - name: Install All Dependencies
        run: |
          # 1. Install UI dependencies (needed for npm run dev)
          echo "Installing UI dependencies..."
          cd ../react-cloud-ui && npm ci

          # 2. Install E2E dependencies (Playwright)
          echo "Installing E2E dependencies..."
          cd ../e2e-tests && npm ci

          # 3. Install Playwright Browsers
          npx playwright install --with-deps

      - name: Create Dummy Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          cat <<EOF > $HOME/.kube/config
          apiVersion: v1
          clusters:
          - cluster:
              server: https://localhost:8443
            name: dummy-cluster
          contexts:
          - context:
              cluster: dummy-cluster
              user: dummy-user
            name: dummy-context
          current-context: dummy-context
          kind: Config
          preferences: {}
          users:
          - name: dummy-user
            user:
              token: dummy-token
          EOF

      - name: Run Playwright tests
        env:
          PORT: 3000
          API_PORT: 8080
          PLAYWRIGHT_TEST_BASE_URL: http://localhost:3000
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npx playwright test

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: week-5/e2e-tests/playwright-report/
          retention-days: 7

  # BUILD & PUSH
  release:
    name: Build and Push
    needs: [go-tests, playwright-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: week-4/go-rest-api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest

      - name: Build and push UI
        uses: docker/build-push-action@v5
        with:
          context: week-5/react-cloud-ui
          push: true
          tags: |
            ${{ env.UI_IMAGE }}:${{ github.sha }}
            ${{ env.UI_IMAGE }}:latest

  # GITOPS UPDATE
  deploy:
    name: Update Manifests
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update image tags
        run: |
          sed -i "s|image: ${{ env.API_IMAGE }}.*|image: ${{ env.API_IMAGE }}:${{ github.sha }}|g" week-4/go-rest-api/deploy/deployment.yaml
          sed -i "s|image: ${{ env.UI_IMAGE }}.*|image: ${{ env.UI_IMAGE }}:${{ github.sha }}|g" week-4/go-rest-api/deploy/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add week-4/go-rest-api/deploy/deployment.yaml
          git commit -m "deploy: update images to ${{ github.sha }} [skip ci]"
          git push origin main

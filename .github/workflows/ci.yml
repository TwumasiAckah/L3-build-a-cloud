name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Global permissions for the GITHUB_TOKEN
permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: week-4/go-rest-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: week-4/go-rest-api/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Run tests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: go test -v -race ./...
